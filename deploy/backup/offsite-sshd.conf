# Append this account to any existing AllowUsers policy; do not replace other users.
Match User skm_site_backup
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile /etc/ssh/authorized_keys/skm_site_backup
    ForceCommand /bin/false
    AllowTcpForwarding remote
    AllowStreamLocalForwarding no
    GatewayPorts no
    PermitListen 127.0.0.1:22224
    PermitOpen none
    PermitTTY no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitUserRC no
Match all
