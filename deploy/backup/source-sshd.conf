# Merge AllowUsers into the EXISTING policy; sshd accumulates all AllowUsers tokens.
# Confirm effective policy for ALL existing accounts using sshd -T -C before reload.
AllowUsers skm_site_export@127.0.0.1
Match User skm_site_export
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile /etc/ssh/authorized_keys/skm_site_export
    ForceCommand /usr/bin/python3 -I /opt/skm-site-backup/forced.py
    DisableForwarding yes
    PermitTTY no
    AllowAgentForwarding no
    X11Forwarding no
    PermitUserRC no
Match all
