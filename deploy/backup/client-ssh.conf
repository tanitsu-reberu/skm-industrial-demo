Host skm-site-source
    HostName 127.0.0.1
    Port 22224
    User skm_site_export
    HostKeyAlias skm-site-source
    UserKnownHostsFile /etc/skm-site-backup/source-known-hosts
    GlobalKnownHostsFile /dev/null
    StrictHostKeyChecking yes
    IdentitiesOnly yes
    IdentityAgent none
    BatchMode yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    RequestTTY no
    ForwardAgent no
    ClearAllForwardings yes
    LogLevel QUIET
