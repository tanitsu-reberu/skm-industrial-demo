Host skm-site-offsite
    HostName 45.138.157.30
    Port 22
    User skm_site_backup
    HostKeyAlias skm-site-offsite
    UserKnownHostsFile /etc/skm-site-backup/offsite-known-hosts
    GlobalKnownHostsFile /dev/null
    StrictHostKeyChecking yes
    IdentitiesOnly yes
    IdentityAgent none
    BatchMode yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    RequestTTY no
    ForwardAgent no
    ExitOnForwardFailure yes
    ConnectTimeout 10
    ServerAliveInterval 30
    ServerAliveCountMax 3
    LogLevel QUIET
